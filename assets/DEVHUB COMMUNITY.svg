<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="60%" stop-color="#05090d" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Neon Blue Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Neon Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Dezenter Hintergrund-Glow in der Mitte -->
  <circle cx="960" cy="480" r="450" fill="#00b4d8" opacity="0.04" filter="url(#subtleGlow)" />

  <!-- ZENTRIERTE GRUPPE: LOGO + GROSSER TEXT DARUNTER -->
  <g transform="translate(960, 420)">
    
    <!-- Äußeres Schild mit Glow -->
    <g filter="url(#glow)">
      <path d="M 0 -180 C 120 -180, 180 -140, 180 -60 C 180 80, 80 180, 0 240 C -80 180, -180 80, -180 -60 C -180 -140, -120 -180, 0 -180 Z" 
            fill="#071b28" 
            stroke="url(#neonBlue)" 
            stroke-width="7" 
            stroke-linejoin="round" 
            opacity="0.95" />
    </g>

    <!-- Code Icon im Schild (</>) -->
    <g filter="url(#glow)" stroke="url(#neonBlue)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Links: < -->
      <path d="M -50 -40 L -95 0 L -50 40" />
      <!-- Rechts: > -->
      <path d="M 50 -40 L 95 0 L 50 40" />
      <!-- Slash: / -->
      <line x1="18" y1="-55" x2="-18" y2="55" stroke="#e0f7ff" stroke-width="12" />
    </g>

    <!-- GROSSER TEXT DEVHUB COMMUNITY DIREKT UNTER DEM LOGO -->
    <g filter="url(#glow)">
      <text x="0" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" letter-spacing="12">DEVHUB</text>
      <text x="0" y="410" text-anchor="middle" fill="#00b4d8" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="16">COMMUNITY</text>
    </g>

  </g>

</svg>

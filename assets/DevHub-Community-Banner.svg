<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Neon Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect x="10" y="10" width="1180" height="380" rx="24" fill="url(#bgGrad)" stroke="url(#frameGrad)" stroke-width="6" />

  <!-- Shield Icon with Code Symbol on Left -->
  <g transform="translate(180, 200)">
    <g filter="url(#glow)">
      <path d="M 0 -110 C 80 -110, 115 -90, 115 -35 C 115 50, 60 110, 0 145 C -60 110, -115 50, -115 -35 C -115 -90, -80 -110, 0 -110 Z" fill="#071b28" stroke="url(#neonBlue)" stroke-width="5" stroke-linejoin="round" />
    </g>
    <g filter="url(#glow)">
      <path d="M -30 -35 L -65 0 L -30 35" fill="none" stroke="url(#neonBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 30 -35 L 65 0 L 30 35" fill="none" stroke="url(#neonBlue)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 15 -50 L -15 50" fill="none" stroke="#e0f7ff" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography Right -->
  <g transform="translate(360, 0)">
    <text x="0" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="10" filter="url(#glow)">DEVHUB</text>
    <text x="5" y="245" fill="#00b4d8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="12">COMMUNITY &amp; DEVELOPMENT</text>
    
    <!-- Badges -->
    <g transform="translate(5, 285)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#071b28" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.6" />
      <text x="90" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python &amp; Web</text>

      <rect x="195" y="0" width="170" height="38" rx="8" fill="#071b28" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.6" />
      <text x="280" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Automatisierung</text>

      <rect x="380" y="0" width="180" height="38" rx="8" fill="#071b28" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.6" />
      <text x="470" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Custom Scripts</text>
    </g>
  </g>

  <!-- Status Dot -->
  <circle cx="1145" cy="55" r="8" fill="#22c55e" filter="url(#glow)" />
</svg>

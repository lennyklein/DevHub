<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Neon Blue Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Neon Blue Gradient for Shields/Text -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1200" height="400" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- ZENTRIERTE GRUPPE (Größer skaliert) -->
  <g transform="translate(100, 10)">
    
    <!-- GROSSES SCHILD LINKS -->
    <g filter="url(#glow)" transform="translate(0, 0) scale(1.25)">
      <!-- Äußeres Schild -->
      <path d="M 160 30 C 230 30, 265 50, 265 92 C 265 175, 210 235, 160 278 C 110 235, 55 175, 55 92 C 55 50, 90 30, 160 30 Z" fill="#071b28" stroke="url(#neonBlue)" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Trophäen- / Pokal-Symbol im Schild -->
      <path d="M 130 90 L 190 90 L 180 160 C 180 172, 170 182, 160 182 C 150 182, 140 172, 140 160 Z" fill="none" stroke="url(#neonBlue)" stroke-width="6" stroke-linecap="round" />
      <line x1="145" y1="192" x2="175" y2="192" stroke="#e0f7ff" stroke-width="6" stroke-linecap="round" />
      <!-- Pokal-Kelch Füllung -->
      <path d="M 136 95 L 184 95 L 175 155 C 175 163, 168 170, 160 170 C 152 170, 145 163, 145 155 Z" fill="#00b4d8" opacity="0.4" />
    </g>

    <!-- TEXTBLOCK RECHTS VOM LOGO (Deutlich größer) -->
    <g transform="translate(390, 115)">
      <text x="0" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="6" filter="url(#glow)">DEVHUB</text>
      <text x="0" y="105" fill="#00b4d8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="5">LEVELSYSTEM</text>
    </g>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Neon Blue Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Neon Blue Gradient for Elements -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1200" height="400" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- ZENTRIERTE MASTER-GRUPPE (Tickets-Logo links + Text block) -->
  <g transform="translate(110, 10)">
    
    <!-- TICKETS SCHILD LINKS -->
    <g filter="url(#glow)" transform="translate(0, 0) scale(1.25)">
      <!-- Äußeres Schild -->
      <path d="M 160 30 C 230 30, 265 50, 265 92 C 265 175, 210 235, 160 278 C 110 235, 55 175, 55 92 C 55 50, 90 30, 160 30 Z" fill="#071b28" stroke="url(#neonBlue)" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Ticket-Symbol im Schild (Coupon / Support Ticket) -->
      <g transform="translate(115, 80)">
        <!-- Hauptkörper Ticket -->
        <path d="M 0 10 C 0 4, 4 0, 10 0 L 80 0 C 86 0, 90 4, 90 10 L 90 25 C 82 25, 82 35, 90 35 L 90 50 C 84 50, 80 54, 80 60 L 10 60 C 4 60, 0 56, 0 50 L 0 35 C 8 35, 8 25, 0 25 Z" fill="url(#neonBlue)" opacity="0.85" stroke="#e0f7ff" stroke-width="3" stroke-linejoin="round" />
        <!-- Gestrichelte Trennlinie im Ticket -->
        <line x1="28" y1="5" x2="28" y2="55" stroke="#071b28" stroke-width="3" stroke-dasharray="4,4" />
        <!-- Stern / Plus Detail -->
        <circle cx="58" cy="30" r="8" fill="none" stroke="#e0f7ff" stroke-width="2.5" />
      </g>
    </g>

    <!-- DEVHUB TICKETS TEXT RECHTS -->
    <g transform="translate(390, 115)">
      <text x="0" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="6" filter="url(#glow)">DEVHUB</text>
      <text x="0" y="105" fill="#00b4d8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="5">TICKETS</text>
    </g>

  </g>
</svg>

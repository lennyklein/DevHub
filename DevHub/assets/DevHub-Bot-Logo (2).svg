<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Circle) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Neon Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Rundes Basis-Icon mit Rand -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Äußerer dekorativer Kreis -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00b4d8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 4" />

  <!-- Schild & Neues Tech/Circuit-Bot-Symbol in der Mitte -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Schild -->
    <path d="M 256 90 
             C 330 90, 365 110, 365 152 
             C 365 235, 310 295, 256 338 
             C 202 295, 147 235, 147 152 
             C 147 110, 182 90, 256 90 Z" 
          fill="#071b28" stroke="url(#neonBlue)" stroke-width="6" stroke-linejoin="round" />
          
    <!-- Tech / Circuit Brain / AI Bot Core -->
    <!-- Zentraler CPU/Knoten -->
    <rect x="236" y="150" width="40" height="60" rx="8" fill="none" stroke="url(#neonBlue)" stroke-width="4" />
    <circle cx="256" cy="180" r="6" fill="#e0f7ff" />
    
    <!-- Linke Schaltkreis-Pfade -->
    <path d="M 236 170 L 206 170 L 206 150 L 190 150" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="184" cy="150" r="5" fill="#00d2ff" />
    <path d="M 236 190 L 206 190 L 206 210 L 190 210" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="184" cy="210" r="5" fill="#00d2ff" />
    
    <!-- Rechte Schaltkreis-Pfade -->
    <path d="M 276 170 L 306 170 L 306 150 L 322 150" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="328" cy="150" r="5" fill="#00d2ff" />
    <path d="M 276 190 L 306 190 L 306 210 L 322 210" fill="none" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="328" cy="210" r="5" fill="#00d2ff" />
    
    <!-- Obere Verbindung (Antenne/Datenstrom) -->
    <line x1="256" y1="150" x2="256" y2="120" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="114" r="6" fill="#00d2ff" />
    
    <!-- Untere Verbindung -->
    <line x1="256" y1="210" x2="256" y2="240" stroke="url(#neonBlue)" stroke-width="4" stroke-linecap="round" />
    <circle cx="256" cy="246" r="5" fill="#e0f7ff" />
  </g>

  <!-- Typography: DEVHUB -->
  <text x="256" y="385" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle"
        filter="url(#glow)">DEVHUB</text>

  <!-- Typography: BOT -->
  <text x="256" y="425" 
        fill="#00b4d8" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="18" 
        font-weight="700" 
        letter-spacing="7" 
        text-anchor="middle">BOT</text>
</svg>

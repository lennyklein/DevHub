<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </linearGradient>

    <!-- Animierter Farbverlauf für den Rahmen -->
    <linearGradient id="frameAnimGrad" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
      
      <animate attributeName="x1" values="-100%; 100%; 200%" dur="7s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%; 300%" dur="7s" begin="0s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Animierter Farbverlauf für das Schild & Code -->
    <linearGradient id="neonAnimGrad" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
      
      <animate attributeName="x1" values="-100%; 100%; 200%" dur="7s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%; 300%" dur="7s" begin="0.8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Banner Background mit animiertem Rahmen -->
  <rect x="10" y="10" width="1180" height="380" rx="24" fill="url(#bgGrad)" stroke="url(#frameAnimGrad)" stroke-width="6" />

  <!-- Shield Icon mit Code-Symbol auf der linken Seite -->
  <g transform="translate(180, 200)">
    <g filter="url(#glow)">
      <path d="M 0 -110 C 80 -110, 115 -90, 115 -35 C 115 50, 60 110, 0 145 C -60 110, -115 50, -115 -35 C -115 -90, -80 -110, 0 -110 Z" 
            fill="#071b28" stroke="url(#neonAnimGrad)" stroke-width="5" stroke-linejoin="round" />
    </g>
    <g filter="url(#glow)">
      <path d="M -30 -35 L -65 0 L -30 35" fill="none" stroke="url(#neonAnimGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 30 -35 L 65 0 L 30 35" fill="none" stroke="url(#neonAnimGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 15 -50 L -15 50" fill="none" stroke="#e0f7ff" stroke-width="12" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography Rechts -->
  <g transform="translate(360, 0)">
    <text x="0" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="10" filter="url(#glow)">DEVHUB</text>
    <text x="5" y="245" fill="url(#neonAnimGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="12">COMMUNITY &amp; DEVELOPMENT</text>
    
    <!-- Tech Badges -->
    <g transform="translate(5, 285)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="#071b28" stroke="url(#neonAnimGrad)" stroke-width="2" stroke-opacity="0.8" />
      <text x="90" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python &amp; Web</text>

      <rect x="195" y="0" width="170" height="38" rx="8" fill="#071b28" stroke="url(#neonAnimGrad)" stroke-width="2" stroke-opacity="0.8" />
      <text x="280" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Automatisierung</text>

      <rect x="380" y="0" width="180" height="38" rx="8" fill="#071b28" stroke="url(#neonAnimGrad)" stroke-width="2" stroke-opacity="0.8" />
      <text x="470" y="24" fill="#e0f7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Custom Scripts</text>
    </g>
  </g>

  <!-- Blinkender Statuspunkt -->
  <circle cx="1145" cy="55" r="8" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1; 0; 1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>

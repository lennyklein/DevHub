<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b131a" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    
    <!-- Neon Blue Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Neon Blue Gradient for Elements -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1200" height="400" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- ZENTRIERTE MASTER-GRUPPE (Willkommens-Logo links + Text block) -->
  <g transform="translate(110, 10)">
    
    <!-- WILLKOMMEN / USER-ICON SCHILD LINKS -->
    <g filter="url(#glow)" transform="translate(0, 0) scale(1.25)">
      <!-- Äußeres Schild -->
      <path d="M 160 30 C 230 30, 265 50, 265 92 C 265 175, 210 235, 160 278 C 110 235, 55 175, 55 92 C 55 50, 90 30, 160 30 Z" fill="#071b28" stroke="url(#neonBlue)" stroke-width="5" stroke-linejoin="round" />
      
      <!-- User- / Willkommens-Symbol im Schild (Kopf + Körper) -->
      <circle cx="160" cy="95" r="28" fill="url(#neonBlue)" opacity="0.9" />
      <circle cx="160" cy="95" r="28" fill="none" stroke="#e0f7ff" stroke-width="3" />
      <path d="M 115 175 C 115 145, 135 135, 160 135 C 185 135, 205 145, 205 175 Z" fill="url(#neonBlue)" opacity="0.9" />
      <path d="M 115 175 C 115 145, 135 135, 160 135 C 185 135, 205 145, 205 175 Z" fill="none" stroke="#e0f7ff" stroke-width="3" stroke-linejoin="round" />
    </g>

    <!-- DEVHUB WILLKOMMEN TEXT RECHTS -->
    <g transform="translate(390, 115)">
      <text x="0" y="35" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="6" filter="url(#glow)">DEVHUB</text>
      <text x="0" y="105" fill="#00b4d8" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="5">WILLKOMMEN</text>
    </g>

  </g>
</svg>
